<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Jornada ENEM | Seu Guia de Preparação</title>
</head>
<body>
    <div class="caixa-principal">
        <h1>Exame Nacional do Ensino Médio</h1>
        <p class="subtitulo">Descubra seu perfil de estudos e estratégia para o ENEM!</p>
        
        <div class="caixa-inicial">
            <p class="descricao-inicial">
                Pronto para descobrir qual é o seu perfil de preparação? Clique no botão abaixo para receber sua missão individual e começar!
            </p>
            <button class="btn-iniciar">Iniciar Jornada</button>
        </div>

        
        <div class="caixa-jogo escondido">
            <div class="caixa-missao"></div>
            <div class="caixa-perguntas"></div>
            <div class="caixa-alternativas"></div>
        </div>

        
        <div class="caixa-resultado escondido">
            <p class="texto-resultado"></p>
            <button class="btn-jogar-novamente">Jogar Novamente 🔄</button>
        </div>
    </div>

    
    <script type="module" src="script.js"></script>
</body>
</html>
